# Default values for argocd-tag-updater.

# Two replicas with leader election (single active reconciler, warm standby).
replicaCount: 2

image:
  repository: registry.jakeschurch.com/scratch
  tag: latest
  pullPolicy: IfNotPresent

# Path to the controller binary inside the mounted nix bundle.
command: /nix-dynamic/argocd-tag-updater/bundle/bin/argocd-tag-updater

# Enable controller-runtime leader election. Required when replicaCount > 1.
leaderElect: true

# Nix CSI bundle mount. flakeRef is the field the self-updating TagUpdater
# patches on every new argocd-tag-updater build (see homelab tag-updater CR).
nixMount:
  flakeRef: github:jakeschurch/argocd-tag-updater#packages.x86_64-linux.argocd-tag-updater-bundle
  mountPath: /nix-dynamic/argocd-tag-updater

# Mounts an SSH deploy key + a classic PAT for git access. The controller
# prefers GIT_TOKEN over the SSH key when set (internal/source/git.go).
git:
  sshKey:
    enabled: true
    secretName: argocd-tag-updater-github-deploy-key
    mountPath: /etc/git
    keyFile: /etc/git/id_ed25519
    # SSH host keys for Git hosts. This must be another key in the same Secret.
    knownHostsFile: /etc/git/known_hosts
  token:
    enabled: true
    secretName: argocd-tag-updater-git-token
    secretKey: token

# CA bundle path inside the nix bundle (for HTTPS git/registry calls).
sslCertFile: /nix-dynamic/argocd-tag-updater/bundle/etc/ssl/certs/ca-bundle.crt

ports:
  metrics: 8080
  probe: 8081

serviceAccount:
  create: true
  name: argocd-tag-updater

# Ship the TagUpdater CRD with the chart.
crd:
  install: true

# The controller's own TagUpdater — watches this repo's tags and repins
# nixMount.flakeRef on the Application that runs it. Off by default so a
# standalone `helm install` does not create a CR pointing at an Application
# that does not exist. Enabling it in a cluster means removing any other copy
# of this CR from the Application's other sources in the SAME commit: two
# sources rendering one object name fails the sync with duplicate resources.
selfUpdate:
  enabled: false
  # Application to patch. Defaults to the chart fullname.
  argoCDAppName: ""
  interval: 15s
  managingApp:
    name: cluster-apps
    namespace: argocd
  source:
    # Tag stream to watch. Must be the remote the controller can actually
    # reach with its mounted credentials.
    repo: ""
    tagPattern: ^argocd-tag-updater\.(?P<branch>[^.]+)\.(?P<n>\d{14})\.(?P<sha>[0-9a-f]{6})$
  # Rendered with the matched tag's captures ({{ .tag }}, {{ .rev }}, {{ .sha }},
  # {{ .branch }}) and written to spec.sources.0.helm.valuesObject.nixMount.flakeRef.
  flakeRefTemplate: ""
  # Where the patched value is committed so git stays the source of truth.
  writeBack: {}
  #  repo: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/jake/homelab.git
  #  branch: v1
  #  path: vmetal/apps/argocd-tag-updater.yaml
  #  credentialsSecretRef:
  #    name: argocd-tag-updater-forgejo-writeback

# ExternalName alias pointing the conventional `argocd-server` name at the
# Service the ArgoCD release actually created. Off by default: it collides
# with the real Service in a cluster that already uses that name.
argocdServerAlias:
  enabled: false
  name: argocd-server
  externalName: ""
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
