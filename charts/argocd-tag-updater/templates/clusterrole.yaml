apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-tag-updater.fullname" . }}
  labels:
    {{- include "argocd-tag-updater.labels" . | nindent 4 }}
rules:
  # Own CRD — watch instances, read/write status.
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters/status"]
    verbs: ["get", "update", "patch"]

  # Source and write-back credential secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Gate observers receive read-only access only to exact allowlisted kinds.
  {{- range .Values.gateKinds }}
  - apiGroups: [{{ (ternary (first (splitList "/" .apiVersion)) "" (contains "/" .apiVersion)) | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Refresh remains the sole optional write to a watched Application.
  {{- range .Values.gateKinds }}
  {{- if and (eq .apiVersion "argoproj.io/v1alpha1") (eq .kind "Application") }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["patch"]
  {{- end }}
  {{- end }}

  # Leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election + reconcile events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
