apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-tag-updater.fullname" . }}
  labels:
    {{- include "argocd-tag-updater.labels" . | nindent 4 }}
rules:
  # Own CRD — watch instances, read/write status.
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters/status"]
    verbs: ["get", "update", "patch"]

  # Target resources: ArgoCD Applications, Sensors, WorkflowTemplates, Deployments,
  # and any other patch target. Broad get/list/watch + patch/update across all groups —
  # the controller patches arbitrary user-declared target kinds.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election + reconcile events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
