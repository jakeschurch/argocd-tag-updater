apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-tag-updater.fullname" . }}
  labels:
    {{- include "argocd-tag-updater.labels" . | nindent 4 }}
rules:
  # Own CRD — watch instances, read/write status.
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters/status"]
    verbs: ["get", "update", "patch"]

  # Source and write-back credential secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Rollback health observation (read-only).
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]

  # Leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election + reconcile events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
