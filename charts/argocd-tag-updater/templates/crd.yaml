{{- if .Values.crd.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: tagupdaters.updater.argocd.io
spec:
  group: updater.argocd.io
  names:
    kind: TagUpdater
    listKind: TagUpdaterList
    plural: tagupdaters
    singular: tagupdater
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.repo
      name: Repo
      type: string
    - jsonPath: .status.lastTag
      name: Last Tag
      type: string
    - jsonPath: .status.lastUpdated
      name: Updated
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              argoCDApp:
                description: |-
                  ArgoCDApp is a read-only reference used to observe sync revision and health.
                  The controller never patches or triggers this Application.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              interval:
                description: Interval between tag polls. Defaults to 2m.
                type: string
              managingApp:
                description: |-
                  ManagingApp optionally identifies the read-only app-of-apps Application whose
                  sync revision must observe the pushed manifest commit. When omitted,
                  ArgoCDApp is used for both revision and health observation.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              rollback:
                description: |-
                  Rollback commits the previous tag's rendered values when ArgoCD reports a
                  terminal deployment failure. Requires ArgoCDApp to be set.
                properties:
                  enabled:
                    type: boolean
                  timeout:
                    description: |-
                      Timeout is how long to wait for the workload to become Healthy after ArgoCD
                      observes the pushed manifest commit. It does not include repository polling
                      latency. Defaults to 20m.
                    type: string
                type: object
              source:
                properties:
                  imagePullSecretRef:
                    description: |-
                      ImagePullSecretRef names a kubernetes.io/dockerconfigjson Secret in the same
                      namespace as the TagUpdater. When set on an oci source, the controller reads
                      the secret and uses its credentials to authenticate against the registry.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  repo:
                    description: |-
                      Repo is a git remote URL (git source), OCI repository reference (oci source),
                      or nix cache tag namespace "<host>/<name>" (nix source).
                    type: string
                  tagPattern:
                    description: |-
                      TagPattern is a named-group regex. Captures are available in Patch templates.
                      The capture named "n" is used as the sort key to select the latest tag.
                      e.g.: platform\.(?P<branch>[^.]+)\.build-(?P<n>\d+)\.(?P<sha>[0-9a-f]{6,})
                    type: string
                  type:
                    type: string
                required:
                - repo
                - tagPattern
                - type
                type: object
              targets:
                description: Targets identifies manifest documents and fields to update
                  when a new tag matches.
                items:
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      description: Name selects a specific CR by name. Mutually exclusive
                        with Selector.
                      type: string
                    namespace:
                      description: Namespace scopes the lookup. Required for namespaced
                        resources.
                      type: string
                    patches:
                      description: Patches is the list of field+template pairs to
                        apply to each matched CR.
                      items:
                        properties:
                          field:
                            description: |-
                              Field is a dot-notation path into the target manifest. e.g. "spec.flakeRef" or
                              "spec.source.helm.valuesObject.image.tag".
                            type: string
                          template:
                            description: |-
                              Template is a Go template rendered with named captures from TagPattern plus
                              repo-derived fields (owner, repo, host, repoURL), "tag" (full tag string),
                              and — for the git source — "rev", the matched tag's immutable full commit
                              sha, enabling an immutable flake ref like
                              "github:{{ "{{" }} .owner }}/{{ "{{" }} .repo }}/{{ "{{" }} .tag }}?rev={{ "{{" }} .rev }}#attr".
                              An absent key renders empty and the whole field is skipped (never blanked).
                            type: string
                        required:
                        - field
                        - template
                        type: object
                      type: array
                    selector:
                      description: |-
                        Selector dynamically selects CRs by label. All matching CRs receive every patch.
                        Mutually exclusive with Name.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - apiVersion
                  - kind
                  - patches
                  type: object
                type: array
              writeBack:
                description: WriteBack is the required git destination for rendered
                  target patches.
                properties:
                  branch:
                    description: Branch is the branch cloned and pushed by the controller.
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret in the TagUpdater namespace. Supported
                      authentication keys are token, username/password, and sshPrivateKey. SSH
                      additionally requires knownHosts, or insecureIgnoreHostKey=true as an
                      explicit opt-in.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  path:
                    description: |-
                      Path is the repository-relative path to a YAML manifest. Multi-document YAML
                      is supported; target identity selects the document to edit.
                    type: string
                  repo:
                    description: |-
                      Repo is the git repository containing the target manifest. It is independent
                      of source.repo, which is only the tag source.
                    type: string
                required:
                - branch
                - credentialsSecretRef
                - path
                - repo
                type: object
            required:
            - source
            - targets
            - writeBack
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastTag:
                type: string
              lastUpdated:
                format: date-time
                type: string
              lastWriteCommit:
                description: |-
                  LastWriteCommit is the manifest branch commit verified by the last
                  successful write-back. It enables a cheap remote-head guard before cloning.
                type: string
              previousTag:
                description: PreviousTag is the tag applied before LastTag.
                type: string
              skippedTags:
                description: |-
                  SkippedTags contains failed tags excluded from Latest() until a newer tag
                  deploys successfully.
                items:
                  type: string
                type: array
              watchingArmedAt:
                description: |-
                  WatchingArmedAt is when the watch was armed, i.e. when WatchingCommit was
                  written. It bounds the phase BEFORE ArgoCD observes the commit.

                  Without it that phase is unbounded: WatchingSince only starts once ArgoCD
                  reports the commit, the rollback timeout is measured from WatchingSince,
                  and Reconcile short-circuits all tag work while WatchingTag is set. An
                  ArgoCD that never picks the commit up (app renamed or deleted, repo
                  credentials broken, branch mismatch, controller down) would therefore
                  freeze the updater permanently while still reporting success.
                format: date-time
                type: string
              watchingCommit:
                description: |-
                  WatchingCommit is the pushed manifest commit ArgoCD must observe before the
                  health timeout clock starts.
                type: string
              watchingSince:
                description: WatchingSince is set when ArgoCD status.sync.revision
                  equals WatchingCommit.
                format: date-time
                type: string
              watchingTag:
                description: WatchingTag is the deployed tag currently under health
                  observation.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
