# Path selection uses OR; every filtered check includes its own CI definitions.
# # go:test stays unconditional as the repository regression backstop: controller/source
# tests read CRDs and repository fixtures. Unknown paths must not produce an empty green
# plan.
# Native checks qualified before queue activation; every selected check blocks landing.
apiVersion: ci.foundrybox.dev/v1alpha1
kind: CheckSuite
metadata:
  name: argocd-tag-updater-checks
  namespace: argo
spec:
  repositoryRef:
    name: argocd-tag-updater
    namespace: forgejo
  context: margo/argocd-tag-updater-checks
  checkout:
    url: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/jake/argocd-tag-updater.git
    deployKeySecret: argocd-tag-updater-margo-readonly
  checks:
    # testReport runs go vet and go test -json in one derivation and keeps the
    # JSON when either fails, so the check covers vet as well.
    - name: go:test
      template: nix-go-test
      kind: test
      params:
        attr: .#testReport
    - name: gofmt
      paths:
        - "**/*.go"
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.mod
        - go.sum
        - go.work
        - go.work.sum
      template: gofmt-check
    - name: vendor:drift
      paths:
        - "**/*.go"
        - go.mod
        - go.sum
        - vendor/**
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.work
        - go.work.sum
      template: generate-drift
      params:
        command: go mod vendor
    - name: nix:bundle
      paths:
        - api/**
        - cmd/**
        - internal/**
        - go.mod
        - go.sum
        - vendor/**
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.work
        - go.work.sum
      template: nix-build
      required: true
      params:
        # The bundle is what the main build tags and the type:nix TagUpdater
        # deploys, so the check builds the same attribute.
        attr: .#argocd-tag-updater-bundle
