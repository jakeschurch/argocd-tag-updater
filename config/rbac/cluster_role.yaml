apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-tag-updater
rules:
  # Own CRD — full CRUD + status
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters", "tagupdaters/status"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Source and write-back credential secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Default gate allowlist (read-only)
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kargo.akuity.io"]
    resources: ["promotions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["patch"]

  # Reconcile and write-back outcome events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]


  # Leader election lease
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
