apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-tag-updater
rules:
  # Own CRD — full CRUD + status
  - apiGroups: ["updater.argocd.io"]
    resources: ["tagupdaters", "tagupdaters/status"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Source and write-back credential secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Rollback health observation (read-only)
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]

  # Reconcile and write-back outcome events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]


  # Leader election lease
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
