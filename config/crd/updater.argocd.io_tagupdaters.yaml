                    afterType:
                      type: string
                      enum: ["", "!!int", "!!float", "!!bool", "!!null"]
                    before:
                      type: string
                    field:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    path:
                      type: string
                  required:
                  - apiVersion
                  - field
                  - kind
                  - name
                  - path
                  type: object
                type: array
              skippedTags:
                description: |-
                  SkippedTags contains failed release tags excluded from selection.
                  They remain excluded when a newer release succeeds.
                items:
                  type: string
                type: array
              watchingArmedAt:
                description: |-
                  WatchingArmedAt is when the watch was armed, i.e. when WatchingCommit was
                  written. It bounds the phase BEFORE ArgoCD observes the commit.

                  Without it that phase is unbounded: WatchingSince only starts once ArgoCD
