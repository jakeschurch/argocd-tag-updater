                      x-kubernetes-validations:
                      - message: exactly one of name or selector is required
                        rule: has(self.name) != has(self.selector)
                      - message: use a preset or a complete custom CEL source
                        rule: 'has(self.preset) ? !(has(self.apiVersion) || has(self.kind)
                          || has(self.deployed) || has(self.healthy) || has(self.failed))
                          : (has(self.apiVersion) && has(self.kind) && has(self.deployed)
                          && has(self.healthy) && has(self.failed))'
                      - message: gate GVK must be allowlisted
                        rule: has(self.preset) || (has(self.apiVersion) && has(self.kind)
                          && ((self.apiVersion == 'argoproj.io/v1alpha1' && self.kind
                          in ['Application', 'Rollout', 'AnalysisRun']) || (self.apiVersion
                          == 'apps/v1' && self.kind in ['Deployment', 'StatefulSet', 'DaemonSet'])
                          || (self.apiVersion == 'kargo.akuity.io/v1alpha1' && self.kind
                          == 'Promotion')))
                    maxItems: 16
                    minItems: 1
                    type: array
                required:
                - sources
                type: object
              watchingRollback:
                description: WatchingRollback holds the app lease until the reverted
                  set is Healthy.
                type: boolean
              watchingSince:
                description: WatchingSince is set when ArgoCD status.sync.revision
                  equals WatchingCommit.
                format: date-time
                type: string
              watchingTag:
                description: WatchingTag is the deployed tag currently under health
                  observation.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
